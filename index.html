<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IRIAM 配信補助ツール</title>
<meta name="description" content="IRIAM配信者向け補助ツール。都道府県・星座・MBTI・ギフト耐久チェック、入室カウンター、企画ガチャ、進捗ツイート機能付き。">
<meta name="theme-color" content="#4ecde6">
<meta property="og:title" content="IRIAM 配信補助ツール">
<meta property="og:description" content="都道府県・星座・MBTI・ギフト耐久チェック、入室カウンター、企画ガチャ搭載の配信補助ツール">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ac:#4ecde6; --ac-light:#d0f5fb; --ac-dark:#2aa8c0;
  --bg:#f4fcfe; --white:#fff; --border:#cdeef5;
  --text:#1a3a42; --text2:#7aaab5;
  --red:#ff5c6a; --green:#3dcc7a;
  --shadow:0 2px 12px rgba(78,205,230,.13);
  --sidebar-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;min-height:100vh;overflow-x:hidden}

/* ===== HEADER ===== */
header{background:var(--white);border-bottom:2px solid var(--border);box-shadow:var(--shadow);padding:10px 14px 0;position:sticky;top:0;z-index:200}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.logo{font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;color:var(--ac-dark);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:6px}
.color-btn{background:var(--ac-light);border:2px solid var(--border);color:var(--ac-dark);padding:5px 10px;border-radius:16px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap}
.reset-all-btn{background:#fff0f2;border:2px solid #ffd0d6;color:var(--red);padding:5px 10px;border-radius:16px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap}
.tweet-btn{background:linear-gradient(135deg,#1da1f2,#0d8fd6);border:none;color:white;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap}

/* ===== TABS (mobile) ===== */
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 12px 9px;border-radius:10px 10px 0 0;border:2px solid transparent;border-bottom:none;background:transparent;color:var(--text2);font-family:inherit;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap;position:relative;bottom:-2px;display:flex;align-items:center;gap:4px}
.tab.active{background:var(--white);color:var(--text);border-color:var(--border);border-bottom-color:var(--white)}

/* ===== PC LAYOUT ===== */
@media(min-width:768px){
  header{padding:12px 24px 0}
  .logo{font-size:20px}
  .tabs{display:none}
  .layout{display:flex;min-height:calc(100vh - 70px)}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--white);border-right:2px solid var(--border);padding:16px 12px;position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:900;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:4px;border:2px solid transparent;white-space:nowrap}
  .sidebar-item:hover{background:var(--ac-light);color:var(--ac-dark)}
  .sidebar-item.active{background:var(--ac-light);color:var(--ac-dark);border-color:var(--border)}
  .sidebar-icon{font-size:16px}
  .content-area{flex:1;padding:24px;max-width:900px}
  .check-grid{grid-template-columns:repeat(5,1fr)}
  .check-grid.cols2{grid-template-columns:repeat(3,1fr)}
  .check-grid.cols4{grid-template-columns:repeat(6,1fr)}
  .mbti-grid{grid-template-columns:repeat(4,1fr)}
  .star-grid{grid-template-columns:repeat(6,1fr)}
  .gift-grid-inner{grid-template-columns:repeat(5,1fr)}
  .counter-list{flex-direction:row;flex-wrap:wrap}
  .counter-item-card{flex:1;min-width:260px}
  .any-list-wrap{display:flex;flex-wrap:wrap;gap:10px}
  .any-card{flex:1;min-width:260px}
}
@media(max-width:767px){
  .layout{display:block}
  .sidebar{display:none}
  .content-area{padding:14px}
  .gift-grid-inner{grid-template-columns:repeat(3,1fr)}
}

/* ===== MAIN ===== */
.page{display:none}
.page.active{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ===== PAGE HEAD ===== */
.page-head{background:var(--white);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:2px solid var(--border)}
.page-head-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.page-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;display:flex;align-items:center;gap:7px}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.prog-text{font-size:12px;font-weight:900;color:var(--text2)}
.prog-text span{font-size:19px;color:var(--text);font-family:'Nunito',sans-serif}
.prog-text.done span{color:var(--green)}
.done-badge{display:inline-flex;align-items:center;gap:3px;background:#e6fff2;border:2px solid #b0f0cc;color:var(--green);font-size:11px;font-weight:900;padding:3px 9px;border-radius:20px}
.reset-btn{background:var(--ac-light);border:2px solid var(--border);color:var(--ac-dark);padding:6px 12px;border-radius:12px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.reset-btn:active{transform:scale(.93)}
.prog-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;background:var(--ac);transition:width .4s cubic-bezier(.34,1.56,.64,1)}

/* ===== CHECK GRID ===== */
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.check-item{background:var(--white);border:2px solid var(--border);border-radius:13px;padding:9px 8px;cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:6px;user-select:none;box-shadow:var(--shadow)}
.check-item:active{transform:scale(.93)}
.check-item.checked{background:var(--ac-light);border-color:var(--ac);opacity:.7}
.cb{width:19px;height:19px;border-radius:5px;border:2.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .14s;background:var(--white)}
.check-item.checked .cb{background:var(--ac);border-color:var(--ac);color:white}
.cl{font-size:11px;font-weight:900;line-height:1.2}
.check-item.checked .cl{text-decoration:line-through;color:var(--text2)}
.cs{font-size:9px;color:var(--text2);margin-top:1px}

/* ===== MBTI ===== */
.mbti-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mbti-item{background:var(--white);border:2px solid var(--border);border-radius:14px;padding:11px;cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:9px;user-select:none;box-shadow:var(--shadow)}
.mbti-item:active{transform:scale(.94)}
.mbti-item.checked{background:var(--ac-light);border-color:var(--ac);opacity:.65}
.mbti-item.checked .cb{background:var(--ac);border-color:var(--ac);color:white}
.mbti-code{font-family:'Nunito',sans-serif;font-weight:900;font-size:14px}
.mbti-name{font-size:9px;color:var(--text2);margin-top:1px}

/* ===== STAR ===== */
.star-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.star-illo-card{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:12px 8px 8px;text-align:center;box-shadow:var(--shadow)}
.star-illo-card svg{width:70px;height:70px;display:block;margin:0 auto 6px}
.star-illo-name{font-size:11px;font-weight:900}
.star-illo-en{font-size:9px;color:var(--text2)}

/* ===== GIFT ===== */
.gift-cat-card{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
.gift-cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cat-pill{font-size:12px;font-weight:900;padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center}
.cat-count{font-size:12px;font-weight:900;color:var(--text2)}
.cat-count.done{color:var(--green)}
.gift-grid-inner{display:grid;gap:7px;margin-bottom:8px}

/* ===== COUNTER ===== */
.counter-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.counter-item-card{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.counter-item-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.counter-item-name{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;font-weight:900;padding:7px 10px;outline:none;transition:border-color .16s}
.counter-item-name:focus{border-color:var(--ac)}
.counter-item-del{background:#fff0f2;border:2px solid #ffd0d6;border-radius:10px;color:var(--red);font-family:inherit;font-size:13px;font-weight:900;padding:7px 10px;cursor:pointer;flex-shrink:0}
.counter-item-del:active{transform:scale(.92)}
.counter-item-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:52px;line-height:1;color:var(--ac-dark);text-align:center;display:block;transition:color .2s}
.counter-item-num.danger{color:var(--red)}
.counter-item-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn-mid{padding:12px;border-radius:13px;border:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;cursor:pointer;transition:all .13s}
.btn-mid:active{transform:scale(.91)}
.counter-item-quick{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.counter-item-custom{display:flex;gap:6px;margin-top:7px;align-items:center}
.counter-item-custom-input{width:72px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;font-weight:900;padding:8px 6px;text-align:center;outline:none}
.counter-item-custom-input:focus{border-color:var(--ac)}
.btn-custom-s{border-radius:10px;font-family:inherit;font-size:11px;font-weight:900;padding:8px 11px;cursor:pointer;border:2px solid;white-space:nowrap}
.btn-custom-s:active{transform:scale(.91)}
.counter-item-set{display:flex;gap:6px;margin-top:7px;align-items:center}
.counter-item-set-input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;font-weight:900;padding:8px 10px;text-align:center;outline:none}
.counter-item-set-input:focus{border-color:var(--ac)}
.btn-set-s{background:var(--ac);border:none;border-radius:10px;color:white;font-family:inherit;font-size:12px;font-weight:900;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn-set-s:active{transform:scale(.92)}
.add-counter-btn{width:100%;padding:14px;border-radius:16px;border:2px dashed var(--border);background:var(--white);color:var(--ac-dark);font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;transition:all .16s}
.add-counter-btn:active{transform:scale(.97)}
.any-card{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.any-label{font-size:11px;font-weight:900;color:var(--text2);white-space:nowrap}
.any-num-input{width:72px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;padding:9px 6px;text-align:center;outline:none;transition:border-color .15s}
.any-num-input:focus{border-color:var(--ac)}
.any-op-btn{width:52px;height:52px;border-radius:12px;border:2px solid;font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0}
.any-op-btn:active{transform:scale(.90)}
.any-minus{background:#fff0f2;border-color:#ffd0d6;color:var(--red)}
.any-plus{background:#efffef;border-color:#c0f0cc;color:var(--green)}
.any-del{background:transparent;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:4px 6px;margin-left:auto;flex-shrink:0}

/* ===== GACHA ===== */
.gacha-wrap{display:flex;flex-direction:column;gap:12px}
.card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card-label{font-size:12px;font-weight:900;color:var(--text2);margin-bottom:9px}
.gacha-textarea{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;font-weight:700;padding:11px 13px;resize:vertical;min-height:110px;outline:none;line-height:1.7;transition:border-color .16s}
.gacha-textarea:focus{border-color:var(--ac)}
.gacha-textarea::placeholder{color:var(--text2)}
.gacha-count{font-size:11px;font-weight:900;color:var(--text2);text-align:right;margin-top:5px}
.gacha-btn{width:100%;padding:17px;border-radius:16px;border:none;background:var(--ac);color:white;font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;cursor:pointer;transition:all .16s;box-shadow:0 4px 16px rgba(78,205,230,.35)}
.gacha-btn:active{transform:scale(.96)}
.gacha-result-inner{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gacha-placeholder{font-size:13px;color:var(--text2);font-weight:700}
.gacha-result-label{font-size:11px;color:var(--text2);font-weight:900;letter-spacing:.06em;margin-bottom:7px}
.gacha-result-text{font-family:'Nunito',sans-serif;font-weight:900;font-size:24px;color:var(--ac-dark);animation:popIn .32s cubic-bezier(.34,1.56,.64,1);line-height:1.3;word-break:break-all}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:var(--bg);border-radius:9px;margin-bottom:5px;font-size:13px;font-weight:700}
.hist-num{font-size:10px;color:var(--text2);font-weight:900}

/* ===== TWEET MODAL ===== */
.tweet-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.tweet-modal-overlay.open{display:flex}
.tweet-modal{background:var(--white);border-radius:24px;padding:22px;width:92%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.tweet-modal-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;margin-bottom:14px;text-align:center}
.tweet-preview{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all;margin-bottom:12px;min-height:80px}
.tweet-char{font-size:11px;color:var(--text2);text-align:right;margin-bottom:12px;font-weight:900}
.tweet-char.over{color:var(--red)}
.tweet-hashtag{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;padding:9px 12px;outline:none;margin-bottom:12px;transition:border-color .16s}
.tweet-hashtag:focus{border-color:var(--ac)}
.tweet-modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-tweet-cancel{background:var(--bg);border:2px solid var(--border);border-radius:14px;color:var(--text2);font-family:inherit;font-size:13px;font-weight:900;padding:12px;cursor:pointer}
.btn-tweet-go{background:linear-gradient(135deg,#1da1f2,#0d8fd6);border:none;border-radius:14px;color:white;font-family:inherit;font-size:13px;font-weight:900;padding:12px;cursor:pointer}
.btn-tweet-go:active{transform:scale(.96)}

/* ===== COLOR MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:24px;padding:22px;width:88%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;margin-bottom:16px;text-align:center}
.color-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.color-preset{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.color-preset:active{transform:scale(.88)}
.color-preset.selected{border-color:var(--text)}
.color-custom-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.color-custom-label{font-size:12px;font-weight:900;color:var(--text2)}
.color-input{width:44px;height:44px;border:2px solid var(--border);border-radius:12px;cursor:pointer;padding:2px;background:none}
.modal-close{width:100%;padding:12px;background:var(--ac);border:none;border-radius:14px;color:white;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}

/* ===== CONFIRM MODAL ===== */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--white);border-radius:22px;padding:24px 20px 18px;width:82%;max-width:300px;box-shadow:0 8px 40px rgba(0,0,0,.22);text-align:center}
.confirm-msg{font-size:15px;font-weight:900;margin-bottom:18px;line-height:1.5}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-cancel{background:var(--bg);border:2px solid var(--border);border-radius:14px;color:var(--text2);font-family:inherit;font-size:14px;font-weight:900;padding:12px;cursor:pointer}
.confirm-ok{background:var(--red);border:none;border-radius:14px;color:white;font-family:inherit;font-size:14px;font-weight:900;padding:12px;cursor:pointer}
.confirm-ok:active{transform:scale(.96)}

/* ===== MISC ===== */
.confetti{position:fixed;pointer-events:none;z-index:9999;font-size:22px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(540deg) scale(.5);opacity:0}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ===== TWEET CATEGORY CHECKS ===== */
.tweet-cat-check{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:5px 9px;cursor:pointer;font-size:11px;font-weight:900;color:var(--text2);transition:all .14s;user-select:none}
.tweet-cat-check.on{background:var(--ac-light);border-color:var(--ac);color:var(--ac-dark)}
.tweet-cat-check .tcc{width:14px;height:14px;border-radius:4px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;background:var(--white)}
.tweet-cat-check.on .tcc{background:var(--ac);border-color:var(--ac);color:white}

/* ===== GIFT TOGGLE ===== */
.gift-toggle-btn{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;transition:all .15s}
.gift-toggle-btn.active{background:var(--ac);color:white;box-shadow:0 2px 8px rgba(78,205,230,.3)}

/* ===== DURABILITY ===== */
.dur-card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.dur-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dur-title-input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;font-weight:900;padding:8px 12px;outline:none;transition:border-color .16s}
.dur-title-input:focus{border-color:var(--ac)}
.dur-del-btn{background:#fff0f2;border:2px solid #ffd0d6;border-radius:12px;color:var(--red);font-family:inherit;font-size:13px;font-weight:900;padding:8px 11px;cursor:pointer;flex-shrink:0}
.dur-del-btn:active{transform:scale(.92)}
.dur-prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dur-prog-text{font-size:12px;font-weight:900;color:var(--text2)}
.dur-prog-text span{font-size:18px;color:var(--text);font-family:'Nunito',sans-serif}
.dur-prog-text.done span{color:var(--green)}
.dur-items{display:flex;flex-direction:column;gap:7px;margin:10px 0}

.dur-item .cb{width:20px;height:20px;border-radius:6px;border:2.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .14s;background:var(--white)}

.dur-item-label{flex:1;font-size:13px;font-weight:900;line-height:1.3}
.dur-item.checked .dur-item-label{text-decoration:line-through;color:var(--text2)}
.dur-item-del{background:transparent;border:none;color:var(--text2);font-size:15px;cursor:pointer;padding:2px 5px;flex-shrink:0;opacity:.6}
.dur-add-row{display:flex;gap:8px;margin-top:6px}
.dur-add-input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;padding:9px 12px;outline:none;transition:border-color .16s}
.dur-add-input:focus{border-color:var(--ac)}
.dur-add-btn{background:var(--ac);border:none;border-radius:12px;color:white;font-family:inherit;font-size:13px;font-weight:900;padding:9px 14px;cursor:pointer;white-space:nowrap}
.dur-add-btn:active{transform:scale(.93)}
.dur-reset-btn{background:var(--ac-light);border:2px solid var(--border);color:var(--ac-dark);padding:6px 10px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit}
.dur-reset-btn:active{transform:scale(.93)}

.roulette-item-row{display:flex;align-items:center;gap:8px}
.roulette-item-input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;font-weight:700;padding:9px 12px;outline:none;transition:border-color .16s}
.roulette-item-input:focus{border-color:var(--ac)}
.roulette-item-del{background:#fff0f2;border:2px solid #ffd0d6;border-radius:10px;color:var(--red);font-family:inherit;font-size:13px;font-weight:900;padding:7px 11px;cursor:pointer;flex-shrink:0}
.roulette-item-del:active{transform:scale(.92)}


.dark-rarity-block{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}

.dark-item-input:focus{border-color:var(--ac)}
.dark-item-del{background:transparent;border:none;color:var(--text2);font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0}

<body>

<!-- CONFIRM MODAL -->
<div class="confirm-overlay" id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg">リセットしますか？</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="confirm-ok" id="confirm-ok-btn" onclick="doConfirmOk()">リセット</button>
    </div>
  </div>
</div>

<!-- COLOR MODAL -->
<div class="modal-overlay" id="color-modal">
  <div class="modal">
    <div class="modal-title">🎨 テーマカラーを選ぶ</div>
    <div class="color-presets" id="color-presets"></div>
    <div class="color-custom-row">
      <span class="color-custom-label">カスタム：</span>

      <span style="font-size:12px;font-weight:900;color:var(--text2)">← 自由に選択</span>
    </div>
    <button class="modal-close" onclick="closeColorModal()">✓ 決定</button>
  </div>
</div>

<!-- TWEET MODAL -->
<div class="tweet-modal-overlay" id="tweet-modal">
  <div class="tweet-modal">
    <div class="tweet-modal-title">🐦 進捗をツイート</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px" id="tweet-cat-checks"></div>
    <div class="tweet-preview" id="tweet-preview"></div>
    <div class="tweet-char" id="tweet-char">0 / 280</div>
    <input class="tweet-hashtag" type="text" id="tweet-hashtag" placeholder="#IRIAM #IRIAMライバー" value="#IRIAM #IRIAMライバー" oninput="updateTweetPreview()">
    <div class="tweet-modal-btns">
      <button class="btn-tweet-cancel" onclick="closeTweetModal()">キャンセル</button>

</div>

<header>

      <button class="color-btn" onclick="openColorModal()">🎨 カラー</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-area">
    <main>

    <!-- 都道府県 -->

      </div>
      <div class="check-grid cols4" id="grid-pref"></div>
    </div>

    <!-- 星座 -->

      <div class="page-head">
        <div class="page-head-top">
          <div class="page-title">⭐ 12星座</div>
          <button class="reset-btn" onclick="resetSection('star')">リセット</button>
        </div>
        <div class="prog-row">
          <div class="prog-text" id="prog-text-star"><span>0</span> / 12</div>
          <div id="done-star"></div>

    </div>

    <!-- MBTI -->

        </div>

      </div>
    </div>

    </main>
  </div>
</div>

// ===== SANITIZE (XSS対策) =====
function esc(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== COLOR =====
const PRESETS=['#4ecde6','#ff6eb4','#a06aff','#3dcc7a','#ff8c42','#ffca3a','#ff5c6a','#5b9fff','#e060c0','#00b894'];
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}
function lighten(h,a=.82){const{r,g,b}=hexToRgb(h);const m=c=>Math.round(c+(255-c)*a);return`rgb(${m(r)},${m(g)},${m(b)})`}
function darken(h,a=.25){const{r,g,b}=hexToRgb(h);const d=c=>Math.round(c*(1-a));return`rgb(${d(r)},${d(g)},${d(b)})`}
function applyColor(hex){
  const r=document.documentElement;
  r.style.setProperty('--ac',hex);
  r.style.setProperty('--ac-light',lighten(hex,.85));
  r.style.setProperty('--ac-dark',darken(hex,.2));
  r.style.setProperty('--border',lighten(hex,.7));
  r.style.setProperty('--bg',lighten(hex,.93));
}
function buildPresets(){
  const c=document.getElementById('color-presets');
  c.innerHTML='';
  PRESETS.forEach(hex=>{
    const btn=document.createElement('div');
    btn.className='color-preset';
    btn.style.background=hex;
    btn.onclick=()=>{
      document.querySelectorAll('.color-preset').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('custom-color-input').value=hex;
      applyColor(hex);
    };
    c.appendChild(btn);
  });
  c.children[0].classList.add('selected');
}

function switchTab(id){
  document.querySelectorAll('.tab,.sidebar-item').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const tab=document.getElementById('tab-'+id);
  const side=document.getElementById('sidebar-'+id);
  const page=document.getElementById('page-'+id);
  if(tab){tab.classList.add('active');tab.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
  if(side)side.classList.add('active');
  if(page)page.classList.add('active');
}

// ===== PROGRESS =====
function updateProg(sec,total){
  const count=state[sec].size;
  const bar=document.getElementById('bar-'+sec);
  const pt=document.getElementById('prog-text-'+sec);
  const dn=document.getElementById('done-'+sec);
  if(bar)bar.style.width=(total?count/total*100:0)+'%';
  if(pt){pt.innerHTML=`<span>${count}</span> / ${total}`;pt.className='prog-text'+(count===total&&total?' done':'');}
  if(dn)dn.innerHTML=(count===total&&total>0)?'<span class="done-badge">🎉 コンプリート！</span>':'';
  if(count===total&&total>0)celebrate();
}
function updateGiftCat(cat){
  const count=state.gift[cat].size,total=GIFTS[cat].items.length;
  const el=document.getElementById('cat-count-'+cat);
  const bar=document.getElementById('bar-gift-'+cat);
  if(el){el.textContent=`${count} / ${total}`;el.className='cat-count'+(count===total?' done':'');}
  if(bar)bar.style.width=(count/total*100)+'%';
}
function updateGiftAll(){
  const total=Object.values(GIFTS).reduce((s,g)=>s+g.items.length,0);

  if(bar)bar.style.width=(count/total*100)+'%';

}

  const g=document.getElementById('grid-pref');
  g.innerHTML='';
  PREFS.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='check-item'+(state.pref.has(i)?' checked':'');
    el.setAttribute('data-idx',i);
    el.innerHTML=`<div class="cb">${state.pref.has(i)?'✓':''}</div><div class="cl">${p}</div>`;
    el.onclick=()=>{
      if(state.pref.has(i)){state.pref.delete(i);el.classList.remove('checked');el.querySelector('.cb').textContent='';}
      else{state.pref.add(i);el.classList.add('checked');el.querySelector('.cb').textContent='✓';}
      updateProg('pref',PREFS.length);
    };
    g.appendChild(el);
  });
  updateProg('pref',PREFS.length);
}

let counterIdSeq=0,anyIdSeq=0;
function addCounter(name='',initVal=100){
  const id=++counterIdSeq;
  state.counters.push({id,name:name||`入室耐久${id}`,value:initVal,initVal});
  renderCounterList();
}
function removeCounter(id){
  state.counters=state.counters.filter(c=>c.id!==id);
  renderCounterList();
}
function updateCounterDisplay(id){
  const c=state.counters.find(c=>c.id===id);
  if(!c)return;
  const el=document.getElementById(`cnum-${id}`);
  if(el){el.textContent=c.value;el.className='counter-item-num'+(c.value<=10?' danger':'');}
}
function changeCount(id,n){
  const c=state.counters.find(c=>c.id===id);
  if(!c)return;
  c.value=Math.max(0,c.value+n);
  updateCounterDisplay(id);
}
function doCustomCount(id,sign){
  const inp=document.getElementById(`ccustom-${id}`);
  const v=parseInt(inp?.value)||1;
  const c=state.counters.find(c=>c.id===id);
  if(!c)return;
  c.value=Math.max(0,c.value+sign*v);
  updateCounterDisplay(id);
}
function setCounterVal(id){
  const inp=document.getElementById(`cset-${id}`);
  const v=parseInt(inp?.value);
  const c=state.counters.find(c=>c.id===id);
  if(!c||isNaN(v)||v<0)return;
  c.value=v;c.initVal=v;
  updateCounterDisplay(id);
}

const TWEET_CATS=[

function buildTweetText(hashtag){
  const lines=[];
  // 都道府県
  if(tweetCatState.pref){
    const prefDone=state.pref.size,prefTotal=PREFS.length;
    const prefRem=PREFS.filter((_,i)=>!state.pref.has(i));
    lines.push(`🗾 47都道府県 ${prefDone}/${prefTotal}`);
    if(prefRem.length>0&&prefRem.length<=5)lines.push(`残り：${prefRem.join(' ')}`);
  }
  // 星座
  if(tweetCatState.star){
    const starDone=state.star.size,starTotal=STARS.length;
    const starRem=STARS.filter((_,i)=>!state.star.has(i)).map(s=>s.n);
    lines.push(`⭐ 12星座 ${starDone}/${starTotal}`);
    if(starRem.length>0&&starRem.length<=3)lines.push(`残り：${starRem.join(' ')}`);
  }
  // MBTI
  if(tweetCatState.mbti){
    const mbtiDone=state.mbti.size,mbtiTotal=MBTI_LIST.length;
    const mbtiRem=MBTI_LIST.filter((_,i)=>!state.mbti.has(i)).map(m=>m.c);
    lines.push(`🧠 MBTI ${mbtiDone}/${mbtiTotal}`);
    if(mbtiRem.length>0&&mbtiRem.length<=4)lines.push(`残り：${mbtiRem.join(' ')}`);
  }
  // ギフト（モードに応じて切り替え）
  if(tweetCatState.gift){
    if(state.giftMode==='full'){
      const giftTotal=Object.values(GIFTS).reduce((s,g)=>s+g.items.length,0);
      const giftDone=Object.values(state.gift).reduce((s,st)=>s+st.size,0);
      lines.push(`🎁 全ギフト耐久 ${giftDone}/${giftTotal}`);
      Object.entries(GIFTS).forEach(([cat,data])=>{
        const rem=data.items.filter((_,i)=>!state.gift[cat].has(i));
        if(rem.length>0&&rem.length<=2)lines.push(`残り[${cat}]：${rem.join(' ')}`);
      });
    } else {
      const pgTotal=Object.values(PETIT_GIFTS).reduce((s,g)=>s+g.items.length,0);
      const pgDone=Object.values(state.petitGift).reduce((s,st)=>s+st.size,0);
      lines.push(`💎 プチギフト耐久 ${pgDone}/${pgTotal}`);
      Object.entries(PETIT_GIFTS).forEach(([cat,data])=>{
        const rem=data.items.filter((_,i)=>!state.petitGift[cat].has(i));
        if(rem.length>0&&rem.length<=2)lines.push(`残り[${cat}]：${rem.join(' ')}`);
      });
    }
  }
  // カウンター
  if(tweetCatState.counter&&state.counters.length>0){
    state.counters.forEach(c=>{
      lines.push(`🚪 ${c.name} ${c.value}`);
    });
  }
  if(lines.length>0)lines.push('');
  lines.push(hashtag||'#IRIAM #IRIAMライバー');
  return lines.join('\n');
}
function updateTweetPreview(){
  const hashtag=document.getElementById('tweet-hashtag').value;
  const text=buildTweetText(hashtag);
  document.getElementById('tweet-preview').textContent=text;
  const len=text.length;
  const charEl=document.getElementById('tweet-char');
  charEl.textContent=`${len} / 280`;
  charEl.className='tweet-char'+(len>280?' over':'');
}

    const empties=Math.max(0,5-state.darkItems[rar].length);
    const emptyHtml=Array.from({length:empties},(_,j)=>`<div class="dark-item-wrap"><input class="dark-item-input" type="text" placeholder="アイテム名" onblur="addDarkItemInline('${rar}',this)" onkeydown="if(event.key==='Enter'){this.blur()}"></div>`).join('');
    block.innerHTML=`<div class="dark-rarity-head"><span class="dark-rarity-badge" style="background:${DARK_RARITY_COLORS[rar]}">${rar}</span><span class="dark-rate-label">確率</span><input class="dark-rate-input" type="number" id="dark-rate-${rar}" value="${state.darkRates[rar]}" min="0" max="100" step="0.1" oninput="updateDarkRate('${rar}',this.value)"><span class="dark-rate-label">%</span></div><div class="dark-items-grid" id="dark-items-${rar}">${itemsHtml}${emptyHtml}<button class="dark-add-item-btn" onclick="addDarkItem('${rar}')">＋ 追加</button></div>`;
    wrap.appendChild(block);
  });
  updateDarkRateWarn();
}
function addDarkItemInline(rar,input){
  const val=input.value.trim();
  if(!val)return;
  state.darkItems[rar].push(val);
  // UIを再構築してインデックスズレを防ぐ
  buildDarkSettings();
}
function addDarkItem(rar){
  state.darkItems[rar].push('');
  buildDarkSettings();
}
function removeDarkItem(rar,idx){
  state.darkItems[rar].splice(idx,1);
  buildDarkSettings();
}
function updateDarkRate(rar,val){
  state.darkRates[rar]=parseFloat(val)||0;
  updateDarkRateWarn();
}
function updateDarkRateWarn(){
  const total=DARK_RARITY_ORDER.reduce((s,r)=>s+(parseFloat(document.getElementById('dark-rate-'+r)?.value)||state.darkRates[r]),0);
  const warn=document.getElementById('dark-rate-warn');
  if(!warn)return;
  const diff=Math.abs(total-100);
  if(diff<0.01){warn.textContent='✅ 合計 100%';warn.style.color='var(--green)';}
  else{warn.textContent=`⚠️ 合計 ${total.toFixed(1)}%（100%になるように調整してください）`;warn.style.color='var(--red)';}
}
function doDarkGacha(n){
  // sync rates from inputs
  DARK_RARITY_ORDER.forEach(r=>{
    const el=document.getElementById('dark-rate-'+r);
    if(el)state.darkRates[r]=parseFloat(el.value)||0;
  });
  // get valid items per rarity
  const pool={};
  DARK_RARITY_ORDER.forEach(r=>{
    pool[r]=state.darkItems[r].filter(v=>v.trim());
  });
  // 有効なアイテムが存在するレアリティが1つ以上あるかチェック
  const totalItems=DARK_RARITY_ORDER.reduce((s,r)=>s+pool[r].length,0);
  if(totalItems===0){
    const warn=document.getElementById('dark-rate-warn');
    if(warn){warn.textContent='⚠️ アイテムを1つ以上設定してからガチャを引いてください';warn.style.color='var(--red)';}
    return;
  }
  // 確率が設定されているが対応アイテムがないレアリティは確率を再分配
  let totalRate=DARK_RARITY_ORDER.reduce((s,r)=>s+state.darkRates[r],0);
  // draw
  const results=[];
  for(let i=0;i<n;i++){
    const rand=Math.random()*100;
    let cum=0,picked=null;
    for(const r of DARK_RARITY_ORDER){
      cum+=state.darkRates[r];
      if(rand<cum){picked=r;break;}
    }
    if(!picked)picked='N';
    // アイテムが空のレアリティが当選した場合、有効アイテムのあるレアリティから再抽選
    if(!pool[picked]||!pool[picked].length){
      const validRars=DARK_RARITY_ORDER.filter(r=>pool[r]&&pool[r].length>0);
      if(validRars.length>0)picked=validRars[Math.floor(Math.random()*validRars.length)];
    }
    const items=pool[picked]||[];
    const item=items.length?items[Math.floor(Math.random()*items.length)]:picked;
    results.push({rar:picked,item});
  }
  // aggregate duplicates
  const agg={};
  results.forEach(({rar,item})=>{
    const key=`${rar}__${item}`;
    if(!agg[key])agg[key]={rar,item,count:0};
    agg[key].count++;
  });
  const sorted=Object.values(agg).sort((a,b)=>DARK_RARITY_ORDER.indexOf(b.rar)-DARK_RARITY_ORDER.indexOf(a.rar));
  // display result
  const resultCard=document.getElementById('dark-result-card');
  const grid=document.getElementById('dark-result-grid');
  const summary=document.getElementById('dark-result-summary');
  resultCard.style.display='block';
  summary.textContent=`${n}回`;
  grid.innerHTML='';
  sorted.forEach(({rar,item,count})=>{
    const card=document.createElement('div');
    card.className='dark-result-card';
    card.style.animation='popIn .3s cubic-bezier(.34,1.56,.64,1)';
    card.innerHTML=`<span class="dark-result-rarity" style="background:${DARK_RARITY_COLORS[rar]}">${esc(rar)}</span><span class="dark-result-name">${esc(item)}</span>${count>1?`<span class="dark-result-count">×${count}</span>`:''}`;
    grid.appendChild(card);
  });
  // add to history
  const listenerName=(document.getElementById('dark-listener-name')?.value.trim())||'';
  const histCard=document.getElementById('dark-history-card');
  const histList=document.getElementById('dark-history-list');
  histCard.style.display='block';
  state.darkHistory.unshift({n,results:sorted,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),name:listenerName});
  // 現在の結果カードのツイートボタンにindex=0をセット
  const rBtn=document.getElementById('dark-result-tweet-btn');
  if(rBtn)rBtn.onclick=()=>tweetDarkResult(0);
  histList.innerHTML=state.darkHistory.slice(0,10).map((h,idx)=>`<div class="dark-hist-item"><div class="dark-hist-meta"><span>${h.name?esc(h.name)+' · ':''}<span style="font-weight:900;color:var(--text)">${h.n}連</span></span><div style="display:flex;align-items:center;gap:6px"><span>${h.time}</span><button class="dark-tweet-btn" onclick="tweetDarkResult(${idx})">🐦</button></div></div><div class="dark-hist-tags">${h.results.map(r=>`<span class="dark-hist-tag" style="background:${DARK_RARITY_COLORS[r.rar]}">${esc(r.item)}${r.count>1?`×${r.count}`:''}</span>`).join('')}</div></div>`).join('');
}
function doDarkGachaCustom(){
  const n=parseInt(document.getElementById('dark-custom-num').value)||1;
  doDarkGacha(Math.min(n,5000));
}
function clearDarkHistory(){
  showConfirm('ガチャ履歴をクリアしますか？',()=>{
    state.darkHistory=[];
    document.getElementById('dark-history-card').style.display='none';
    document.getElementById('dark-result-card').style.display='none';
  });
}
function tweetDarkResult(idx){
  const h=state.darkHistory[idx];
  if(!h)return;
  const lines=[];
  if(h.name)lines.push(h.name);
  lines.push(`闇ガチャ${h.n}連`);
  lines.push('');
  h.results.forEach(r=>{
    const label=r.rar.toLowerCase();
    const count=r.count>1?` ×${r.count}`:'';
    lines.push(`${label} ${r.item}${count}`);
  });
  const text=lines.join('\n');
  const replyUrl=document.getElementById('dark-reply-url')?.value.trim()||'';
  const match=replyUrl.match(/status\/(\d+)/);
  const replyId=match?match[1]:'';
  let url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text);
  if(replyId)url+='&in_reply_to='+replyId;
  window.open(url,'_blank');
}

// ===== DURABILITY =====
let durIdSeq=0;
function addDurability(title=''){
  const id=++durIdSeq;
  state.durability.push({id,title:title||`耐久${id}`,items:[]});
  renderDurabilityList();
}
function removeDurability(id){
  showConfirm('この耐久を削除しますか？',()=>{
    state.durability=state.durability.filter(d=>d.id!==id);
    renderDurabilityList();
  });
}
let durItemIdSeq=0;
function addDurItem(durId){
  const d=state.durability.find(d=>d.id===durId);
  if(!d)return;
  const inp=document.getElementById(`dur-add-input-${durId}`);
  const val=inp?inp.value.trim():'';
  if(!val)return;
  d.items.push({id:++durItemIdSeq,label:val,checked:false});
  inp.value='';
  renderDurabilityList();
}
function addDurItemOnEnter(e,durId){
  if(e.key==='Enter')addDurItem(durId);
}
function toggleDurItem(durId,itemId){
  const d=state.durability.find(d=>d.id===durId);
  if(!d)return;
  const item=d.items.find(i=>i.id===itemId);
  if(!item)return;
  item.checked=!item.checked;
  renderDurabilityList();
  // 全チェック時に紙吹雪
  if(d.items.length>0&&d.items.every(i=>i.checked))celebrate();
}
function removeDurItem(durId,itemId){
  const d=state.durability.find(d=>d.id===durId);
  if(!d)return;
  d.items=d.items.filter(i=>i.id!==itemId);
  renderDurabilityList();
}
function resetDurability(id){
  const d=state.durability.find(d=>d.id===id);
  if(!d)return;
  showConfirm('この耐久のチェックをリセットしますか？',()=>{
    d.items.forEach(i=>i.checked=false);
    renderDurabilityList();
  });
}
function renderDurabilityList(){
  const wrap=document.getElementById('durability-list');
  if(!wrap)return;
  wrap.innerHTML='';
  state.durability.forEach(d=>{
    const total=d.items.length;
    const done=d.items.filter(i=>i.checked).length;
    const pct=total?done/total*100:0;
    const card=document.createElement('div');
    card.className='dur-card';
    const itemsHtml=d.items.map(item=>`
      <div class="dur-item${item.checked?' checked':''}" onclick="toggleDurItem(${d.id},${item.id})">
        <div class="cb">${item.checked?'✓':''}</div>
        <div class="dur-item-label">${esc(item.label)}</div>
        <button class="dur-item-del" onclick="(function(e){e.stopPropagation();removeDurItem(${d.id},${item.id})})(event)">✕</button>
      </div>`).join('');
    const doneHtml=total>0&&done===total?'<span class="done-badge">🎉 コンプリート！</span>':'';
    card.innerHTML=`
      <div class="dur-head">
        <input class="dur-title-input" type="text" value="${esc(d.title)}" placeholder="耐久名を入力" oninput="state.durability.find(x=>x.id===${d.id}).title=this.value">
        <button class="dur-reset-btn" onclick="resetDurability(${d.id})">リセット</button>
        <button class="dur-del-btn" onclick="removeDurability(${d.id})">✕</button>
      </div>
      <div class="dur-prog-row">
        <div class="dur-prog-text${done===total&&total>0?' done':''}"><span>${done}</span> / ${total}</div>
        ${doneHtml}
      </div>
      <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      <div class="dur-items">${itemsHtml}</div>
      <div class="dur-add-row">
        <input class="dur-add-input" type="text" id="dur-add-input-${d.id}" placeholder="項目を追加…" onkeydown="addDurItemOnEnter(event,${d.id})">
        <button class="dur-add-btn" onclick="addDurItem(${d.id})">追加</button>
      </div>
    `;
    wrap.appendChild(card);
  });
}

// ===== ROULETTE =====
const ROULETTE_COLORS=['#4ecde6','#ff6eb4','#a06aff','#3dcc7a','#ff8c42','#ffca3a','#ff5c6a','#5b9fff','#e060c0','#00b894','#fd79a8','#6c5ce7'];
let rouletteItems=['項目1','項目2','項目3'];
let rouletteSpinning=false;
let rouletteAngle=0;
let rouletteResult='';

function renderRouletteItemInputs(){
  const wrap=document.getElementById('roulette-items-wrap');
  if(!wrap)return;
  wrap.innerHTML='';
  rouletteItems.forEach((item,i)=>{
    const row=document.createElement('div');
    row.className='roulette-item-row';
    row.innerHTML=`<input class="roulette-item-input" type="text" value="${esc(item)}" placeholder="項目${i+1}" oninput="rouletteItems[${i}]=this.value;drawRouletteWheel()"><button class="roulette-item-del" onclick="removeRouletteItem(${i})">✕</button>`;
    wrap.appendChild(row);
  });
  drawRouletteWheel();
}
function addRouletteItem(){
  rouletteItems.push(`項目${rouletteItems.length+1}`);
  renderRouletteItemInputs();
}
function removeRouletteItem(i){
  if(rouletteItems.length<=2)return;
  rouletteItems.splice(i,1);
  renderRouletteItemInputs();
}
function resetRouletteItems(){
  showConfirm('項目をリセットしますか？',()=>{
    rouletteItems=['項目1','項目2','項目3'];
    renderRouletteItemInputs();
    document.getElementById('roulette-result-card').style.display='none';
  });
}
function drawRouletteWheel(highlightIdx=-1){
  const canvas=document.getElementById('roulette-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2, r=W/2-4;
  const items=rouletteItems.filter(s=>s.trim());
  if(!items.length)return;
  const n=items.length;
  const slice=(2*Math.PI)/n;
  ctx.clearRect(0,0,W,H);
  items.forEach((item,i)=>{
    const start=rouletteAngle+i*slice;
    const end=start+slice;
    const col=ROULETTE_COLORS[i%ROULETTE_COLORS.length];
    // セクター
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle=i===highlightIdx?'#fffde7':col;
    ctx.fill();
    ctx.strokeStyle='white';
    ctx.lineWidth=2;
    ctx.stroke();
    // テキスト
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start+slice/2);
    ctx.textAlign='right';
    ctx.fillStyle='white';
    ctx.font=`bold ${Math.min(14,200/n+4)}px 'M PLUS Rounded 1c',sans-serif`;
    ctx.shadowColor='rgba(0,0,0,.35)';
    ctx.shadowBlur=3;
    const label=item.length>8?item.slice(0,7)+'…':item;
    ctx.fillText(label,r-10,4);
    ctx.restore();
  });
  // 中心円
  ctx.beginPath();
  ctx.arc(cx,cy,18,0,2*Math.PI);
  ctx.fillStyle='white';
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.1)';
  ctx.lineWidth=2;
  ctx.stroke();
}
function spinRoulette(){
  if(rouletteSpinning)return;
  const items=rouletteItems.filter(s=>s.trim());
  if(items.length<2)return;
  rouletteSpinning=true;
  document.getElementById('roulette-spin-btn').disabled=true;
  document.getElementById('roulette-result-card').style.display='none';
  const extraSpins=5+Math.floor(Math.random()*5); // 5〜9周
  const n=items.length;
  const slice=(2*Math.PI)/n;
  // 当選インデックスをランダムに決定
  const winIdx=Math.floor(Math.random()*n);
  // 矢印は右(canvas 0rad=3時方向)を指す
  // winIdxセクター中心が0radに来る条件: rouletteAngle + winIdx*slice + slice/2 ≡ 0
  // → finalAngle = -(winIdx*slice + slice/2)
  const finalAngle=-(winIdx*slice+slice/2);
  const startAngle=rouletteAngle%(2*Math.PI);
  let totalDelta=finalAngle-startAngle+2*Math.PI*extraSpins;
  if(totalDelta<2*Math.PI)totalDelta+=2*Math.PI; // 最则1周は保証
  const duration=4000+Math.random()*1000;
  const startTime=performance.now();
  function easeOut(t){return 1-Math.pow(1-t,4);}
  function frame(now){
    const t=Math.min((now-startTime)/duration,1);
    rouletteAngle=startAngle+totalDelta*easeOut(t);
    drawRouletteWheel();
    if(t<1){requestAnimationFrame(frame);}
    else{
      rouletteAngle=rouletteAngle%(2*Math.PI);
      drawRouletteWheel(winIdx);
      rouletteResult=items[winIdx];
      const rc=document.getElementById('roulette-result-card');
      const rt=document.getElementById('roulette-result-text');
      rc.style.display='block';
      rt.textContent=rouletteResult;
      rouletteSpinning=false;
      document.getElementById('roulette-spin-btn').disabled=false;
      celebrate();
    }
  }
  requestAnimationFrame(frame);
}
function tweetRouletteResult(){
  if(!rouletteResult)return;
  const text=`ルーレット結果：${rouletteResult}`;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank');
}
